name: Manage stale items

on:
  schedule:
    - cron: "0 0 * * *" # Run daily at midnight UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          close-issue-message: >
            This issue has been automatically closed after waiting 2 weeks with no response from the author.
            If you have more information to provide, please feel free to reopen this issue or open a new one.
          close-pr-message: >
            This pull request has been automatically closed after waiting 2 weeks with no response from the author.
            If you have more information to provide, please feel free to reopen this pull request or open a new one.
          days-before-close: 7
          days-before-stale: 7
          only-labels: "status: waiting for author"
          operations-per-run: 100
          remove-stale-when-updated: true
          stale-issue-label: "status: stale"
          stale-issue-message: >
            This issue has been waiting for a response from the author for 1 week with no activity.
            If there is no further activity in the next 1 week, this issue will be automatically closed.
            Maintainers: to keep this issue open indefinitely, remove the "status: waiting for author" label.
          stale-pr-label: "status: stale"
          stale-pr-message: >
            This pull request has been waiting for a response from the author for 1 week with no activity.
            If there is no further activity in the next 1 week, this pull request will be automatically closed.
            Maintainers: to keep this pull request open indefinitely, remove the "status: waiting for author" label.

  triage-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: 'Ping maintainers on stale triage issues'
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const staleAfter = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString();

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: 'status: in triage',
              sort: 'created',
              direction: 'asc',
              per_page: 100,
            });

            for (const issue of issues) {
              if (new Date(issue.created_at) > new Date(staleAfter)) {
                continue;
              }

              const timeline = await github.paginate(github.rest.issues.listEventsForTimeline, {
                owner,
                repo,
                issue_number: issue.number,
                per_page: 100,
              });

              const hasMaintainerUpdate = timeline.some(event => {
                if (!['labeled', 'unlabeled'].includes(event.event)) {
                  return false;
                }

                if (!event.actor || !event.created_at) {
                  return false;
                }

                return !event.actor.login.includes('github-actions') &&
                  new Date(event.created_at) > new Date(issue.created_at);
              });

              if (hasMaintainerUpdate) {
                continue;
              }

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: issue.number,
                per_page: 100,
              });

              const alreadyPinged = comments.some(comment => {
                return comment.body && comment.body.includes('@mochajs/maintenance-crew') &&
                  comment.body.includes('This issue has been waiting in triage for more than a week');
              });

              if (alreadyPinged) {
                continue;
              }

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: 'This issue has been waiting in triage for more than a week without a maintainer update. @mochajs/maintenance-crew, could someone please take a look?',
              });
            }
