name: Slop Detection

on:
  # WARNING: pull_request_target is needed to label/comment/close PRs from forks.
  # DO NOT CHECK OUT THE REPO IN THIS WORKFLOW.
  pull_request_target:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  issues:
    types: [opened]

permissions: {}

jobs:
  agentscan:
    name: AgentScan
    if: >-
      ${{ (github.event_name == 'pull_request_target' && github.event.action == 'opened') ||
          (github.event_name == 'issues' && github.event.action == 'opened') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Cache AgentScan analysis
        uses: actions/cache@v6
        with:
          path: .agentscan-cache
          key: agentscan-cache-${{ github.actor }}
          restore-keys: agentscan-cache-

      - name: AgentScan
        uses: MatteoGabriele/agentscan-action@v2.5.0
        with:
          auto-close: true
          auto-close-classifications: automation
          cache-path: .agentscan-cache
          github-token: ${{ secrets.GITHUB_TOKEN }}
          label-automation: "spam: automated account"
          label-community-flagged: "spam: community flagged"
          label-mixed: "spam: mixed signals"
          scan-issues: true
          trusted-author-associations: collaborator, member, owner

  anti-slop:
    name: Anti Slop
    if: >-
      ${{ github.event_name == 'pull_request_target' &&
          github.event.action == 'opened' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: write
    steps:
      - name: Anti Slop
        uses: peakoss/anti-slop@v0.3.0
        with:
          close-pr: true
          exempt-label: "spam: exempt"
          failure-add-pr-labels: "spam: likely slop"
          failure-pr-message: >
            Thanks for the contribution. This PR matched multiple low-quality/spam
            signals and does not appear to conform to Mocha's AI contribution
            guidelines. Please review the [AI-Generated Code section of our
            contributing guidelines](https://github.com/mochajs/mocha/blob/main/.github/CONTRIBUTING.md#-ai-generated-code).
            If this was a mistake, please comment with more context and ask a
            maintainer to reconsider.
          lock-pr: false

  reopen-spam-appeal:
    name: Reopen spam appeal as draft
    if: >-
      ${{ github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          github.actor == github.event.issue.user.login }}
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: write
    steps:
      - name: Reopen as draft
        uses: actions/github-script@v9
        with:
          script: |
            const pullNumber = context.payload.issue.number;
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });

            if (pull.state !== 'closed' || !pull.closed_at) {
              return;
            }

            const commentAt = Date.parse(context.payload.comment.created_at);
            const closedAt = Date.parse(pull.closed_at);
            if (commentAt <= closedAt) {
              return;
            }

            const spamLabels = [
              'spam: automated account',
              'spam: community flagged',
              'spam: mixed signals',
              'spam: likely slop',
            ];
            if (!pull.labels.some(label => spamLabels.includes(label.name))) {
              return;
            }
            if (pull.labels.some(label => label.name === 'spam: exempt')) {
              return;
            }

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
              state: 'open',
            });

            if (!pull.draft) {
              await github.graphql(
                `mutation ConvertPullRequestToDraft($pullRequestId: ID!) {
                  convertPullRequestToDraft(input: {pullRequestId: $pullRequestId}) {
                    pullRequest {
                      isDraft
                    }
                  }
                }`,
                { pullRequestId: pull.node_id }
              );
            }
